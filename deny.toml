[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # These older generations are imposed by the current QUIC/WebSocket/TLS
    # graph. Keep every exception exact so any new duplicate fails the gate.
    { name = "getrandom", version = "=0.2.17", reason = "ring retains getrandom 0.2" },
    { name = "webpki-roots", version = "=0.26.11", reason = "tokio-tungstenite exposes the compatibility roots line" },
    { name = "windows-sys", version = "=0.52.0", reason = "ring retains the Windows 0.52 bindings" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
